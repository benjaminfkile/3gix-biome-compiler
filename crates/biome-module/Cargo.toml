[package]
name = "biome-module"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The biome overlay module: colours one frame's land with the measured albedo of the biome tile pyramid."

[lib]
name = "biome_module"
path = "src/lib.rs"
# `cdylib` is the WebAssembly module; `rlib` is what the CLI and the tests
# link.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "biome-module"
path = "src/main.rs"

[dependencies]
biome-tiles = { path = "../biome-tiles" }
gx-core = { workspace = true }
gx-module-guest = { workspace = true }
